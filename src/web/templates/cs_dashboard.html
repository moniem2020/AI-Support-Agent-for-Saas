<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Dashboard - ProTaskFlow Support</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* CS Dashboard specific styles */
        body {
            overflow: auto;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .dashboard-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .notification-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent-red);
            color: white;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .notification-badge.hidden {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-subtle);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .tickets-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        .tickets-table th,
        .tickets-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }

        .tickets-table th {
            background: var(--bg-tertiary);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .tickets-table tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .tickets-table tr:hover {
            background: var(--bg-tertiary);
        }

        .tickets-table tr.unread {
            background: rgba(59, 130, 246, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-ai_resolved {
            background: var(--accent-green);
            color: white;
        }

        .status-pending_review {
            background: var(--accent-orange);
            color: white;
        }

        .status-in_progress {
            background: var(--accent-blue);
            color: white;
        }

        .status-resolved {
            background: var(--accent-purple);
            color: white;
        }

        .status-closed {
            background: var(--text-tertiary);
            color: white;
        }

        /* Priority badges */
        .priority-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-urgent {
            background: #dc2626;
            color: white;
        }

        .priority-high {
            background: #ea580c;
            color: white;
        }

        .priority-normal {
            background: #2563eb;
            color: white;
        }

        .priority-low {
            background: #6b7280;
            color: white;
        }

        .query-preview {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            max-width: 900px;
            width: 95%;
            height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            background: var(--bg-secondary);
        }

        .modal-body-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .ticket-sidebar {
            width: 300px;
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .chat-main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-history-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            position: relative;
            line-height: 1.5;
        }

        .chat-bubble.user {
            align-self: flex-start;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-subtle);
        }

        .chat-bubble.agent {
            align-self: flex-end;
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.ai {
            align-self: flex-end;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-bottom-right-radius: 2px;
        }

        .chat-meta {
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            opacity: 0.8;
            font-weight: 500;
        }

        /* Hide legacy */
        /* .ticket-detail { margin-bottom: 1rem; } */

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-tertiary);
        }

        .ticket-detail {
            margin-bottom: 1.5rem;
        }

        .ticket-detail label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.25rem;
        }

        .ticket-detail-value {
            color: var(--text-primary);
            line-height: 1.5;
        }

        .status-select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .notes-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border: none;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-tertiary);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <h1 class="dashboard-title">CS Agent Dashboard</h1>
            <div id="notificationBadge" class="notification-badge hidden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span id="notificationCount">0</span> Escalated
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats populated by JS -->
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Tickets</button>
            <button class="filter-btn" data-filter="pending_review">Pending Review</button>
            <button class="filter-btn" data-filter="in_progress">In Progress</button>
            <button class="filter-btn" data-filter="ai_resolved">AI Resolved</button>
            <button class="filter-btn" data-filter="resolved">Resolved</button>
            <button class="filter-btn" data-filter="closed">Closed</button>
        </div>

        <table class="tickets-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Subject</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Confidence</th>
                    <th>Assigned To</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="ticketsBody">
                <!-- Tickets populated by JS -->
            </tbody>
        </table>

        <div id="emptyState" class="empty-state hidden">
            No tickets found
        </div>
    </div>

    <!-- Ticket Detail Modal -->
    <div class="modal-overlay" id="ticketModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Ticket Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div id="ticketDetails" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script src="/static/js/cs_dashboard.js"></script>
</body>

</html>
